# Frontend Development - Backend built from local source
#
# Usage:
#   1. docker compose -f docker-compose.dev.yml up -d
#   2. make dev-web
#   3. Open http://localhost:5173 (Rsbuild dev server, API auto-proxied to :3000)
#
# Rebuild backend after Go code changes:
#   docker compose -f docker-compose.dev.yml up -d --build new-api
#
# Stop:
#   docker compose -f docker-compose.dev.yml down
#
# Reset data:
#   docker compose -f docker-compose.dev.yml down -v

services:
  new-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        # 避免国内服务器访问 proxy.golang.org 超时
        GOPROXY: https://goproxy.cn,direct
        GOSUMDB: sum.golang.google.cn
    image: new-api-dev:local
    container_name: new-api-dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - dev_data:/data
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://redis
      - TZ=Asia/Shanghai
      - BATCH_UPDATE_ENABLED=true
      - MEDIA_UPLOAD_ENABLED=true
      - MEDIA_S3_BUCKET=${MEDIA_S3_BUCKET:-media-uploads}
      - MEDIA_S3_ENDPOINT=http://minio:9000
      - MEDIA_S3_PUBLIC_ENDPOINT=${MEDIA_S3_PUBLIC_ENDPOINT:-http://localhost:9100}
      - MEDIA_S3_REGION=us-east-1
      - MEDIA_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - MEDIA_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MEDIA_S3_FORCE_PATH_STYLE=true
      # Local HTTP dev mode: keep Secure=false and leave TRUSTED_URL unset. This disables the refresh/logout OriginGuard so the :5173 -> :3000 dev proxy works.
      - SESSION_COOKIE_SECURE=false
      # For HTTPS only: set Secure=true and list every exact trusted HTTPS browser Origin. This does not configure relay CORS.
      # - SESSION_COOKIE_SECURE=true
      # - SESSION_COOKIE_TRUSTED_URL=https://example.com,https://admin.example.com
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - dev-network

  redis:
    image: redis:7-alpine
    container_name: new-api-dev-redis
    restart: unless-stopped
    networks:
      - dev-network

  postgres:
    image: postgres:15-alpine
    container_name: new-api-dev-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: new-api
    volumes:
      - dev_pg_data:/var/lib/postgresql/data
    networks:
      - dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d new-api"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: new-api-dev-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MEDIA_S3_CORS_ALLOW_ORIGIN:-http://localhost:3000,http://localhost:5173}
    volumes:
      - dev_minio_data:/data
    ports:
      - "9100:9000"
      - "9101:9001"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\" &&
      mc mb --ignore-existing \"local/$${MEDIA_S3_BUCKET}\" &&
      mc anonymous set none \"local/$${MEDIA_S3_BUCKET}\" &&
      (mc ilm rule remove --all --force \"local/$${MEDIA_S3_BUCKET}\" || true) &&
      mc ilm rule add --expire-days 7 --prefix \"media-uploads/\" \"local/$${MEDIA_S3_BUCKET}\"
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-media-uploads}
    networks:
      - dev-network

volumes:
  dev_data:
  dev_pg_data:
  dev_minio_data:

networks:
  dev-network:
    driver: bridge
